<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .card { transform-style: preserve-3d; transition: transform 0.15s ease-out; }

    /* Gradient lives on the text span so the emoji keeps its own colours */
    h1 { background: none; color: var(--text); animation: none; }
    h1 .grad {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%      { transform: rotate(-8deg); }
      40%      { transform: rotate(-4deg); }
      50%      { transform: rotate(10deg); }
    }

    .subtitle { min-height: 1.6em; }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent-1);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 14px;
      z-index: 20;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <nav class="nav">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="card" id="card">
    <span class="badge"><span class="dot"></span> Now live</span>
    <h1><span class="grad">Hello, World</span> <span class="wave">👋</span></h1>
    <p class="subtitle"><span id="typed"></span><span class="cursor"></span></p>
    <button class="btn" id="celebrate">Celebrate 🎉</button>
    <footer>Made with HTML, CSS &amp; a little JavaScript</footer>
  </main>

  <script src="stars.js"></script>
  <script>
    // Typewriter effect
    const phrases = [
      "Welcome to your first web page.",
      "Every great project starts here.",
      "Let's build something amazing."
    ];
    const typedEl = document.getElementById("typed");
    let p = 0, c = 0, deleting = false;
    function type() {
      const phrase = phrases[p];
      typedEl.textContent = phrase.slice(0, c);
      if (!deleting && c < phrase.length) { c++; setTimeout(type, 55); }
      else if (!deleting) { deleting = true; setTimeout(type, 1800); }
      else if (c > 0) { c--; setTimeout(type, 28); }
      else { deleting = false; p = (p + 1) % phrases.length; setTimeout(type, 400); }
    }
    type();

    // 3D tilt on mouse move (after the entrance animation releases the transform)
    const card = document.getElementById("card");
    card.addEventListener("animationend", (e) => {
      if (e.target === card) card.style.animation = "none";
    });
    addEventListener("mousemove", (e) => {
      const x = (e.clientX / innerWidth - 0.5) * 12;
      const y = (e.clientY / innerHeight - 0.5) * -12;
      card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
    document.addEventListener("mouseleave", () => card.style.transform = "");

    // Confetti burst
    const colors = ["#ff6ec4", "#7873f5", "#4ade80", "#facc15", "#38bdf8"];
    document.getElementById("celebrate").addEventListener("click", () => {
      for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        piece.style.animationDuration = 2 + Math.random() * 2.5 + "s";
        piece.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5200);
      }
    });
  </script>
</body>
</html>
