<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>:root {
  --bg-1: #0f0c29;
  --bg-2: #302b63;
  --bg-3: #24243e;
  --accent-1: #ff6ec4;
  --accent-2: #7873f5;
  --accent-3: #4ade80;
  --text: #f5f5ff;
  --muted: rgba(245, 245, 255, 0.65);
  --glass: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  color: var(--text);
  background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #1a1446);
  background-size: 400% 400%;
  background-attachment: fixed;
  animation: bgShift 18s ease infinite;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  padding: 104px 16px 48px;
}

@keyframes bgShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Glowing blobs */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  animation: float 14s ease-in-out infinite;
  z-index: 0;
}
.blob.one   { width: 380px; height: 380px; background: var(--accent-1); top: -80px; left: -60px; }
.blob.two   { width: 320px; height: 320px; background: var(--accent-2); bottom: -60px; right: -40px; animation-delay: -5s; }
.blob.three { width: 220px; height: 220px; background: var(--accent-3); top: 55%; left: 60%; opacity: 0.3; animation-delay: -9s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(40px, -30px) scale(1.08); }
  66%      { transform: translate(-30px, 25px) scale(0.95); }
}

canvas#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* Navigation */
.nav {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 4px;
  padding: 6px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  animation: drop 0.8s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes drop {
  from { opacity: 0; transform: translate(-50%, -20px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
.nav a {
  padding: 10px 20px;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  border-radius: 999px;
  white-space: nowrap;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
.nav a.active {
  color: #fff;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  box-shadow: 0 6px 18px rgba(120, 115, 245, 0.45);
}

/* Glass card */
.card {
  position: relative;
  z-index: 1;
  width: min(560px, 100%);
  padding: 56px 40px;
  text-align: center;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.15);
  animation: rise 1s cubic-bezier(.2,.8,.2,1) both;
}
.card.wide { width: min(760px, 100%); }

@keyframes rise {
  from { opacity: 0; transform: translateY(40px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  margin-bottom: 28px;
}
.badge .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-3);
  box-shadow: 0 0 10px var(--accent-3);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.7); }
}

h1 {
  font-size: clamp(2.8rem, 10vw, 5rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 6s linear infinite;
}
@keyframes shimmer {
  to { background-position: 300% center; }
}

.subtitle {
  margin-top: 18px;
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--muted);
}

.btn {
  margin-top: 36px;
  padding: 14px 32px;
  font: inherit;
  font-weight: 600;
  font-size: 1rem;
  color: #fff;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  border: none;
  border-radius: 14px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 0 10px 30px rgba(120, 115, 245, 0.45);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover  { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(255, 110, 196, 0.5); }
.btn:active { transform: translateY(0) scale(0.97); }

footer {
  margin-top: 32px;
  font-size: 0.8rem;
  color: var(--muted);
  opacity: 0.7;
}

/* About page */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-top: 40px;
  text-align: left;
}
.feature {
  padding: 24px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.feature:hover { transform: translateY(-6px); border-color: var(--accent-1); }
.feature .icon { font-size: 1.8rem; }
.feature h3 { margin-top: 12px; font-size: 1.1rem; }
.feature p { margin-top: 6px; font-size: 0.92rem; line-height: 1.5; color: var(--muted); }

.stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 40px;
  margin-top: 40px;
}
.stat strong {
  display: block;
  font-size: 2.2rem;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.stat span { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* Contact page */
.form {
  display: grid;
  gap: 18px;
  margin-top: 36px;
  text-align: left;
}
.form label {
  display: block;
  margin-bottom: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.form input,
.form textarea {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.form textarea { min-height: 140px; resize: vertical; }
.form input::placeholder,
.form textarea::placeholder { color: rgba(245, 245, 255, 0.35); }
.form input:focus,
.form textarea:focus {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 4px rgba(120, 115, 245, 0.25);
}
.form .btn { margin-top: 8px; justify-self: center; }

.success {
  display: none;
  margin-top: 36px;
  padding: 32px;
  border: 1px solid var(--accent-3);
  border-radius: 20px;
  background: rgba(74, 222, 128, 0.08);
  animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
}
.success.show { display: block; }
.success .icon { font-size: 2.4rem; }
.success p { margin-top: 10px; color: var(--muted); }

.contact-info {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px 28px;
  margin-top: 28px;
  font-size: 0.92rem;
  color: var(--muted);
}

@media (max-width: 480px) {
  .card { padding: 44px 22px; }
  .nav a { padding: 9px 14px; font-size: 0.88rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
  <style>
    .card { transform-style: preserve-3d; transition: transform 0.15s ease-out; }

    /* Gradient lives on the text span so the emoji keeps its own colours */
    h1 { background: none; color: var(--text); animation: none; }
    h1 .grad {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%      { transform: rotate(-8deg); }
      40%      { transform: rotate(-4deg); }
      50%      { transform: rotate(10deg); }
    }

    .subtitle { min-height: 1.6em; }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent-1);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 14px;
      z-index: 20;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <nav class="nav">
    <a href="hello-world.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="card" id="card">
    <span class="badge"><span class="dot"></span> Now live</span>
    <h1><span class="grad">Hello, World</span> <span class="wave">👋</span></h1>
    <p class="subtitle"><span id="typed"></span><span class="cursor"></span></p>
    <button class="btn" id="celebrate">Celebrate 🎉</button>
    <footer>Made with HTML, CSS &amp; a little JavaScript</footer>
  </main>

  <script>// Twinkling star field shared by every page
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 9000) }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.2,
    t: Math.random() * Math.PI * 2,
    s: Math.random() * 0.02 + 0.005
  }));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const st of stars) {
    st.t += st.s;
    ctx.globalAlpha = 0.3 + Math.abs(Math.sin(st.t)) * 0.7;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
  }
  requestAnimationFrame(draw);
}

addEventListener("resize", resize);
resize();
draw();
</script>
  <script>
    // Typewriter effect
    const phrases = [
      "Welcome to your first web page.",
      "Every great project starts here.",
      "Let's build something amazing."
    ];
    const typedEl = document.getElementById("typed");
    let p = 0, c = 0, deleting = false;
    function type() {
      const phrase = phrases[p];
      typedEl.textContent = phrase.slice(0, c);
      if (!deleting && c < phrase.length) { c++; setTimeout(type, 55); }
      else if (!deleting) { deleting = true; setTimeout(type, 1800); }
      else if (c > 0) { c--; setTimeout(type, 28); }
      else { deleting = false; p = (p + 1) % phrases.length; setTimeout(type, 400); }
    }
    type();

    // 3D tilt on mouse move (after the entrance animation releases the transform)
    const card = document.getElementById("card");
    card.addEventListener("animationend", (e) => {
      if (e.target === card) card.style.animation = "none";
    });
    addEventListener("mousemove", (e) => {
      const x = (e.clientX / innerWidth - 0.5) * 12;
      const y = (e.clientY / innerHeight - 0.5) * -12;
      card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
    document.addEventListener("mouseleave", () => card.style.transform = "");

    // Confetti burst
    const colors = ["#ff6ec4", "#7873f5", "#4ade80", "#facc15", "#38bdf8"];
    document.getElementById("celebrate").addEventListener("click", () => {
      for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[i % colors.length];
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        piece.style.animationDuration = 2 + Math.random() * 2.5 + "s";
        piece.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5200);
      }
    });
  </script>
</body>
</html>
